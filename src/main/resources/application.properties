spring.application.name=pharmacy

# ?????????????????????????????????????????????????????????????
# DATABASE CONNECTIVITY ARCHITECTURE
# ?????????????????????????????????????????????????????????????
# Note: Synced database path to your exact catalog schema name 'pharmacy'
spring.datasource.url=jdbc:mysql://localhost:3306/pharmacy
spring.datasource.username=root
spring.datasource.password=@hmal1212
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?????????????????????????????????????????????????????????????
# HIBERNATE ORM ENGINE CONFIGURATIONS
# ?????????????????????????????????????????????????????????????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ?????????????????????????????????????????????????????????????
# STAGE CONTROL: FORCED SHUTDOWN SESSION RESET
# ?????????????????????????????????????????????????????????????
# Instructs Embedded Tomcat NEVER to persist session files to disk on shutdown
server.servlet.session.persistent=false

# Sets tracking storage to raw volatile memory so everything wipes out on Rerun
server.servlet.session.store-dir=