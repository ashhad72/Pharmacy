<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Billing System</title>
</head>

<body>

<h1>Pharmacy Billing System</h1>

<hr>

<form action="/billing/create"
      method="post">

    <h2>Customer Details</h2>

    <label>Customer Name:</label>

    <input type="text"
           name="customerName"
           required>

    <br><br>

    <label>Phone Number:</label>

    <input type="text"
           name="phoneNumber">

    <br><br>

    <h2>Medicine Details</h2>

    <label>Medicine ID:</label>

    <input type="number"
           name="medicineId"
           required>

    <br><br>

    <label>Quantity:</label>

    <input type="number"
           name="quantity"
           required>

    <br><br>

    <button type="submit">
        Generate Bill
    </button>

</form>

<br><br>

<a href="/dashboard">
    Back to Dashboard
</a>

</body>
</html>
