<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediTrack Pharmacy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 100%);">

<div class="card" style="max-width: 450px; width: 100%; text-align: center; padding: 3rem 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);">
    <div style="height: 60px; width: 60px; background: var(--primary-light); color: var(--primary); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 1.75rem;">
        <i class="fa-solid th:fa-prescription-bottle-medical">💊</i>
    </div>
    <h1>Welcome to MediTrack</h1>
    <p style="margin-bottom: 2rem;">Enterprise Pharmacy & Inventory Intelligence System</p>
    <hr>
    <a href="/login" class="btn btn-primary" style="display: flex; width: 100%; justify-content: center; padding: 0.9rem;">
        Secure Login <i class="fa-solid fa-arrow-right" style="margin-left: 0.5rem;"></i>
    </a>
</div>

</body>
</html>
