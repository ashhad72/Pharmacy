<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Medicine Inventory</title>
</head>

<body>

<h1>Medicine Inventory</h1>

<hr>

<!-- ADD MEDICINE FORM -->

<h2>Add Medicine</h2>

<form action="/medicines/add" method="post">

    <label>Medicine Name:</label>
    <input type="text"
           name="medicineName"
           required>

    <br><br>

    <label>Category ID:</label>
    <input type="number"
           name="category.categoryId"
           required>

    <br><br>

    <label>Supplier ID:</label>
    <input type="number"
           name="supplier.supplierId"
           required>

    <br><br>

    <label>Batch Number:</label>
    <input type="text"
           name="batchNumber">

    <br><br>

    <label>Price:</label>
    <input type="number"
           step="0.01"
           name="price"
           required>

    <br><br>

    <label>Quantity:</label>
    <input type="number"
           name="quantityInStock"
           required>

    <br><br>

    <label>Manufacture Date:</label>
    <input type="date"
           name="manufactureDate">

    <br><br>

    <label>Expiry Date:</label>
    <input type="date"
           name="expiryDate"
           required>

    <br><br>

    <label>Description:</label>

    <textarea name="description"></textarea>

    <br><br>

    <button type="submit">
        Add Medicine
    </button>

</form>

<hr>

<!-- SEARCH -->

<h2>Search Medicine</h2>

<form action="/medicines/search" method="get">

    <input type="text"
           name="keyword"
           placeholder="Search medicine">

    <button type="submit">
        Search
    </button>

</form>

<br>

<a href="/medicines">
    Show All Medicines
</a>

<br><br>

<a href="/medicines/low-stock">
    Low Stock Medicines
</a>

<br><br>

<a href="/medicines/expired">
    Expired Medicines
</a>

<hr>

<!-- MEDICINE TABLE -->

<h2>Medicine List</h2>

<table border="1">

    <tr>

        <th>ID</th>
        <th>Name</th>
        <th>Category</th>
        <th>Supplier</th>
        <th>Price</th>
        <th>Stock</th>
        <th>Expiry</th>
        <th>Action</th>

    </tr>

    <tr th:each="medicine : ${medicines}">

        <td th:text="${medicine.medicineId}"></td>

        <td th:text="${medicine.medicineName}"></td>

        <td th:text="${medicine.category.categoryName}"></td>

        <td th:text="${medicine.supplier.supplierName}"></td>

        <td th:text="${medicine.price}"></td>

        <td th:text="${medicine.quantityInStock}"></td>

        <td th:text="${medicine.expiryDate}"></td>

        <td>

            <a th:href="@{/medicines/delete/{id}(id=${medicine.medicineId})}">
                Delete
            </a>

        </td>

    </tr>

</table>

<br><br>

<a href="/dashboard">
    Back to Dashboard
</a>

</body>
</html>
